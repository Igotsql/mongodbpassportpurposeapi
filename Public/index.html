<!DOCTYPE html>
<html>

<head>
    <title>Passport & Purpose Traveler Form</title>
</head>

<body>
    <h1>Add a New Traveler</h1>

    <form id="travelerForm">
        <label>First Name</label><br>
        <input type="text" id="firstName" required><br><br>

        <label>Last Name</label><br>
        <input type="text" id="lastName" required><br><br>

        <label>Age</label><br>
        <input type="number" id="age"><br><br>

        <label>City</label><br>
        <input type="text" id="city"><br><br>

        <label>State</label><br>
        <input type="text" id="state"><br><br>

        <label>Has Passport?</label><br>
        <select id="passport">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </select><br><br>

        <label>Favorite Destination</label><br>
        <input type="text" id="favoriteDestination"><br><br>

        <label>Profession</label><br>
        <input type="text" id="profession"><br><br>

        <label>Interests</label><br>
        <input type="text" id="interests" placeholder="Travel, Food, Photography"><br><br>

        <button type="submit">Save Traveler</button>
    </form>

    <p id="message"></p>

    <script>
        const form = document.getElementById("travelerForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const travelerData = {
                firstName: document.getElementById("firstName").value,
                lastName: document.getElementById("lastName").value,
                age: Number(document.getElementById("age").value),
                city: document.getElementById("city").value,
                state: document.getElementById("state").value,
                passport: document.getElementById("passport").value === "true",
                favoriteDestination: document.getElementById("favoriteDestination").value,
                profession: document.getElementById("profession").value,
                interests: document.getElementById("interests").value
                    .split(",")
                    .map(item => item.trim())
            };

            try {
                const response = await fetch("/api/travelers", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(travelerData)
                });

                const result = await response.json();

                if (response.ok) {
                    message.textContent = "Traveler saved successfully.";
                    form.reset();
                } else {
                    message.textContent = "Error: " + result.message;
                }
            } catch (error) {
                message.textContent = "Could not connect to the API.";
            }
        });
    </script>
</body>

</html>
